name = "chassestu-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Les variables définies dans le tableau de bord Cloudflare (APP_ORIGIN,
# CLERK_AUTHORIZED_PARTIES) sont conservées à chaque déploiement.
keep_vars = true

# À définir dans le tableau de bord (Settings → Variables and Secrets) :
#   variables : APP_ORIGIN, CLERK_AUTHORIZED_PARTIES (adresse du site Pages)
#   secrets   : DATABASE_URL, CLERK_SECRET_KEY
[vars]
ENVIRONMENT = "production"
AUTH_MODE = "clerk"

# Développement local : `npm run dev:api` lit api/.dev.vars (ignoré par git).
